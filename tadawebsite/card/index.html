<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaDa social card</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png" />
<link rel="stylesheet" href="../assets/tada.css" />
<style>
  @font-face { font-family: "Newsreader"; src: url("../assets/fonts/newsreader.woff2") format("woff2"); font-weight: 200 800; font-style: normal; font-display: swap; }
  @font-face { font-family: "Newsreader"; src: url("../assets/fonts/newsreader-italic.woff2") format("woff2"); font-weight: 200 800; font-style: italic; font-display: swap; }
  :root { --ink: #0b1c30; --muted: #424753; --bg: #f8f9ff; --line: #c2c6d5; --blue: #0167d4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 22px; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: #fff; box-shadow: 0 1px 8px rgba(11,28,48,.06); }
  header img { width: 32px; height: 32px; border-radius: 50%; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header a { margin-left: auto; color: var(--blue); text-decoration: none; font-weight: 500; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  form { display: flex; flex-direction: column; gap: 10px; background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
  label { font-size: 12px; font-weight: 500; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  input, textarea, select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); width: 100%; }
  input[type=range] { padding: 0; }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: flex; gap: 10px; } .row > label { flex: 1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border-radius: 4px; border: 0; font: inherit; font-weight: 600; cursor: pointer; background: var(--blue); color: #fff; }
  .btn:hover { background: #0050a7; }
  .preview { background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
  canvas { width: 100%; max-width: 720px; height: auto; display: block; margin: 0 auto; border-radius: 6px; box-shadow: 0 1px 8px rgba(11,28,48,.10); }
  .hint { font-size: 12px; color: var(--muted); }
  .err { color: #ba1a1a; font-size: 12px; min-height: 1em; }
</style>
</head>
<body>
<header><img src="../assets/tada-logo.png" alt="" /><h1>TaDa social card</h1><a href="../committee/">Committee app</a></header>
<main>
  <form id="f" autocomplete="off">
    <label>Session from the programme<select id="pick"><option value="">Choose…</option></select></label>
    <label>Speaker<input id="speaker" /></label>
    <label>Affiliation<input id="affiliation" /></label>
    <label>Talk title<textarea id="title"></textarea></label>
    <div class="row"><label>Date<input id="date" type="date" /></label><label>Time (Berlin)<input id="time" type="time" value="17:00" /></label></div>
    <label>Photo (link, or assets/speakers/… path on this site)<input id="photo" placeholder="assets/speakers/2026-10-14-name.jpg" /></label>
    <label>Or use a photo from your computer<input id="file" type="file" accept="image/*" /></label>
    <label>Format<select id="format"><option value="square">Square 1200 × 1200 (LinkedIn, Bluesky)</option><option value="wide">Landscape 1200 × 675 (link previews, LinkedIn)</option></select></label>
    <label>Photo position (up / down) <input id="pos" type="range" min="0" max="100" value="30" /></label>
    <label>Photo zoom <input id="zoom" type="range" min="100" max="220" value="100" /></label>
    <button class="btn" type="button" id="dl">Download PNG</button>
    <span class="hint">Photos stored on this site (assets/speakers/…) or uploaded from your computer can be exported; photos linked from other websites are blocked by the browser.</span>
    <span class="err" id="err"></span>
  </form>
  <div class="preview"><canvas id="c" width="1200" height="1200"></canvas></div>
</main>
<script src="../committee/config.js"></script>
<script>
(function () {
  "use strict";
  function $(s) { return document.querySelector(s); }
  var MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DAYS_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  function dparts(iso) { var p = iso.split("-"); return { y: +p[0], m: +p[1], d: +p[2], dow: new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12)).getUTCDay() }; }
  function berlinOffset(iso) { try { var n = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Berlin", timeZoneName: "longOffset" }).formatToParts(new Date(iso + "T12:00:00Z")).filter(function (x) { return x.type === "timeZoneName"; })[0].value; return /\+02/.test(n) ? 2 : 1; } catch (e) { return 1; } }
  function tz(iso) { return berlinOffset(iso) === 2 ? "CEST" : "CET"; }
  function photoSrc(p) { return /^(https?:|\/|data:|blob:|\.\.\/)/i.test(p) ? p : "../" + p.replace(/^\.\//, ""); }
  var TALKS = [], img = null, imgKey = "", logo = null, fileUrl = "";
  var q = new URLSearchParams(location.search);
  ["speaker", "affiliation", "title", "date", "time", "photo"].forEach(function (k) { if (q.get(k)) $("#" + k).value = q.get(k); });

  /* ----- data ----- */
  function fill(r) { $("#speaker").value = r.speaker || ""; $("#affiliation").value = r.affiliation || ""; $("#title").value = r.title || ""; $("#date").value = r.date || ""; $("#time").value = r.time || "17:00"; $("#photo").value = r.photo || ""; fileUrl = ""; draw(); }
  fetch("../data/talks.json").then(function (r) { return r.json(); }).then(function (rows) {
    TALKS = rows.filter(function (r) { return r.speaker; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    $("#pick").innerHTML = '<option value="">Choose…</option>' + TALKS.map(function (r) { return '<option value="' + r.date + '">' + r.date + " · " + r.speaker + "</option>"; }).join("");
    var d = q.get("date"); if (d) { $("#pick").value = d; if (!q.get("speaker")) { var row = TALKS.filter(function (r) { return r.date === d; })[0]; if (row) fill(row); } }
  }).catch(function () { });
  $("#pick").addEventListener("change", function () { var row = TALKS.filter(function (r) { return r.date === $("#pick").value; })[0]; if (row) fill(row); });
  $("#file").addEventListener("change", function () { var f = this.files && this.files[0]; if (!f) return; if (fileUrl) URL.revokeObjectURL(fileUrl); fileUrl = URL.createObjectURL(f); draw(); });
  ["speaker", "affiliation", "title", "date", "time", "photo", "format", "pos", "zoom"].forEach(function (k) { $("#" + k).addEventListener("input", function () { if (k === "photo") fileUrl = ""; draw(); }); });

  /* ----- drawing helpers ----- */
  function loadImage(src) { return new Promise(function (res, rej) { var i = new Image(); if (/^https?:/i.test(src) && src.indexOf(location.origin) !== 0) i.crossOrigin = "anonymous"; i.onload = function () { res(i); }; i.onerror = function () { rej(new Error("Photo could not be loaded: " + src)); }; i.src = src; }); }
  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function wrap(ctx, text, maxW, maxLines) {
    var words = String(text || "").split(/\s+/).filter(Boolean), lines = [], cur = "";
    words.forEach(function (w) { var t = cur ? cur + " " + w : w; if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; } });
    if (cur) lines.push(cur);
    if (lines.length > maxLines) { lines = lines.slice(0, maxLines); var last = lines[maxLines - 1]; while (ctx.measureText(last + "…").width > maxW && last.length > 1) last = last.replace(/\s*\S+$/, ""); lines[maxLines - 1] = last + "…"; }
    return lines;
  }
  function drawPhoto(ctx, im, x, y, w, h, r, pos, zoom) {
    ctx.save(); roundRect(ctx, x, y, w, h, r); ctx.clip();
    if (!im) {
      ctx.fillStyle = "#dce9ff"; ctx.fillRect(x, y, w, h);
      var name = $("#speaker").value.trim(), ini = name.split(/\s+/).filter(Boolean).slice(0, 2).map(function (s) { return s[0]; }).join("").toUpperCase() || "?";
      ctx.fillStyle = "#0050a7"; ctx.font = "600 " + Math.round(h * 0.32) + "px Inter, system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ini, x + w / 2, y + h / 2); ctx.restore(); return;
    }
    var A = w / h, W0 = im.naturalWidth, H0 = im.naturalHeight, cw, ch;
    if (W0 / H0 > A) { ch = H0; cw = H0 * A; } else { cw = W0; ch = W0 / A; }
    cw /= zoom; ch /= zoom;
    var sx = (W0 - cw) / 2, sy = (H0 - ch) * pos;
    ctx.fillStyle = "#fff"; ctx.fillRect(x, y, w, h);
    ctx.drawImage(im, sx, sy, cw, ch, x, y, w, h); ctx.restore();
  }
  function badge(ctx, x, y, text, red, size) {
    ctx.font = "700 " + size + "px Inter, system-ui, sans-serif"; ctx.textBaseline = "middle"; ctx.textAlign = "left";
    var padX = Math.round(size * 1.1), h = Math.round(size * 2.3), w = Math.ceil(ctx.measureText(text).width) + padX * 2;
    roundRect(ctx, x, y, w, h, 8); ctx.fillStyle = red ? "#d7263d" : "#e5eeff"; ctx.fill();
    ctx.fillStyle = red ? "#fff" : "#0050a7"; ctx.fillText(text, x + padX, y + h / 2 + 1);
    return h;
  }
  function dateText(iso, time) {
    if (!iso) return { text: "DATE TO BE ANNOUNCED", red: false };
    var p = dparts(iso), unusual = p.dow !== 3;
    return { text: (p.d + " " + MONTHS_LONG[p.m - 1] + " " + p.y + (unusual ? " • " + DAYS_LONG[p.dow] : "") + " • " + (time || "17:00") + " " + tz(iso)).toUpperCase(), red: unusual };
  }
  function render(ctx, W, H, im) {
    var wide = W > H, d = dateText($("#date").value, $("#time").value), name = $("#speaker").value.trim() || "Speaker to be announced", aff = $("#affiliation").value.trim(), title = $("#title").value.trim();
    var pos = (+$("#pos").value || 0) / 100, zoom = (+$("#zoom").value || 100) / 100;
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
    ctx.letterSpacing = "0.06em";
    if (!wide) {
      /* photo panel */
      var g = ctx.createLinearGradient(0, 40, 0, 740); g.addColorStop(0, "#16375f"); g.addColorStop(1, "#2f6ea6");
      roundRect(ctx, 40, 40, 1120, 700, 36); ctx.fillStyle = g; ctx.fill();
      drawPhoto(ctx, im, 66, 66, 1068, 648, 24, pos, zoom);
      ctx.letterSpacing = "0.08em"; badge(ctx, 40, 790, d.text, d.red, 24); ctx.letterSpacing = "0em";
      ctx.fillStyle = "#0b1c30"; ctx.font = "500 72px Newsreader, Georgia, serif"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      var nl = wrap(ctx, name, 1120, 1); ctx.fillText(nl[0], 40, 930);
      var y = 990;
      if (aff) { ctx.fillStyle = "#0050a7"; ctx.font = "500 26px Inter, system-ui, sans-serif"; ctx.fillText(wrap(ctx, aff, 1120, 1)[0], 42, y); y += 54; }
      ctx.fillStyle = "#3a4152"; ctx.font = "400 42px Newsreader, Georgia, serif";
      var maxLines = aff ? 2 : 3; wrap(ctx, title, 1120, maxLines).forEach(function (ln) { ctx.fillText(ln, 40, y + 4); y += 54; });
      footer(ctx, W, H);
    } else {
      var g2 = ctx.createLinearGradient(0, 40, 0, 635); g2.addColorStop(0, "#16375f"); g2.addColorStop(1, "#2f6ea6");
      roundRect(ctx, 40, 40, 500, 595, 30); ctx.fillStyle = g2; ctx.fill();
      drawPhoto(ctx, im, 60, 60, 460, 555, 20, pos, zoom);
      ctx.letterSpacing = "0.08em"; badge(ctx, 590, 60, d.text, d.red, 18); ctx.letterSpacing = "0em";
      ctx.fillStyle = "#0b1c30"; ctx.font = "500 52px Newsreader, Georgia, serif"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      var y2 = 170; wrap(ctx, name, 570, 2).forEach(function (ln) { ctx.fillText(ln, 590, y2); y2 += 60; });
      if (aff) { ctx.fillStyle = "#0050a7"; ctx.font = "500 20px Inter, system-ui, sans-serif"; ctx.fillText(wrap(ctx, aff, 570, 1)[0], 592, y2 - 10); y2 += 40; }
      ctx.fillStyle = "#3a4152"; ctx.font = "400 30px Newsreader, Georgia, serif";
      wrap(ctx, title, 570, 5).forEach(function (ln) { ctx.fillText(ln, 590, y2 + 6); y2 += 40; });
      footer(ctx, W, H);
    }
  }
  function footer(ctx, W, H) {
    var wide = W > H, x = wide ? 590 : 40, y = H - 46;
    if (logo) { ctx.save(); ctx.beginPath(); ctx.arc(x + 20, y, 20, 0, Math.PI * 2); ctx.clip(); ctx.drawImage(logo, x, y - 20, 40, 40); ctx.restore(); }
    ctx.fillStyle = "#727785"; ctx.font = "500 20px Inter, system-ui, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText("TaDa · Text-as-Data Speaker Series · Wednesdays 17:00 Berlin time · tada.cool", x + 52, y + 1);
  }
  var drawing = false, again = false;
  function draw() {
    if (drawing) { again = true; return; } drawing = true; $("#err").textContent = "";
    var c = $("#c"), wide = $("#format").value === "wide"; c.width = 1200; c.height = wide ? 675 : 1200;
    var src = fileUrl || ($("#photo").value.trim() ? photoSrc($("#photo").value.trim()) : "");
    var fonts = document.fonts ? Promise.all([document.fonts.load("500 72px Newsreader"), document.fonts.load("400 42px Newsreader"), document.fonts.load("700 24px Inter")]).catch(function () { }) : Promise.resolve();
    var pl = logo ? Promise.resolve(logo) : loadImage("../assets/tada-logo.png").then(function (l) { logo = l; }).catch(function () { });
    var pi = !src ? Promise.resolve(null) : (src === imgKey && img ? Promise.resolve(img) : loadImage(src).then(function (i) { img = i; imgKey = src; return i; }));
    Promise.all([fonts, pl]).then(function () { return pi; }).then(function (im) { render(c.getContext("2d"), c.width, c.height, im); }, function (e) { render(c.getContext("2d"), c.width, c.height, null); $("#err").textContent = e.message; })
      .then(function () { drawing = false; if (again) { again = false; draw(); } });
  }
  $("#dl").addEventListener("click", function () {
    var c = $("#c"), name = "tada-card-" + ($("#date").value || "session") + "-" + ($("#speaker").value.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "speaker") + ($("#format").value === "wide" ? "-wide" : "") + ".png";
    try {
      c.toBlob(function (b) { if (!b) { $("#err").textContent = "Export failed."; return; } var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }, "image/png");
    } catch (e) { $("#err").textContent = "The browser blocks exporting this photo (it comes from another website). Save it to assets/speakers/ or upload it from your computer."; }
  });
  draw();
})();
</script>
</body>
</html>
